<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Page introuvable — HBC Bazadais</title>
<link rel="icon" type="image/png" href="https://raw.githubusercontent.com/albanbontemps33-cell/hbcbazadais/main/hand.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bleu:#0F1E41;
  --brand-blue:#0B76C2;
  --rose:#EA3B79;
  --cream:#FBF7EF;
  --blue-pale:#E9F1FA;
  --ink:#16233F;
  --card:#FFFFFF;
  --border:rgba(234,59,121,.16);
  --border-navy:rgba(15,30,65,.12);
  --shadow-md:0 16px 36px rgba(15,35,65,.11);
  --t:.4s cubic-bezier(.4,0,.2,1);
  --radius:13px;
}
*{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:'DM Sans',sans-serif;
  background:
    radial-gradient(1100px 600px at 15% -10%, rgba(234,59,121,.10), transparent 60%),
    radial-gradient(900px 500px at 110% 10%, rgba(11,118,194,.12), transparent 55%),
    var(--bleu);
  color:var(--ink);
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:2rem 1.25rem;
  overflow-x:hidden;
}
.wrap{width:100%;max-width:560px;text-align:center;animation:riseIn .8s cubic-bezier(.16,1,.3,1) both}
@keyframes riseIn{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}
.logo{height:96px;width:96px;object-fit:cover;border-radius:50%;border:2px solid rgba(255,252,237,.3);box-shadow:0 4px 28px rgba(0,0,0,.4);margin-bottom:1.6rem}
.big404{
  font-family:'Bebas Neue',sans-serif;
  font-size:clamp(6rem,22vw,9rem);
  line-height:.85;
  letter-spacing:.02em;
  color:#FFFCED;
  text-shadow:0 8px 30px rgba(0,0,0,.35);
  margin-bottom:.4rem;
}
.big404 em{color:var(--rose);font-style:normal}
.card{
  background:var(--card);
  border-radius:var(--radius);
  border:1px solid var(--border);
  box-shadow:var(--shadow-md);
  padding:2.6rem 2.2rem;
  position:relative;
  overflow:hidden;
}
.card::before{
  content:'';position:absolute;top:0;left:0;right:0;height:4px;
  background:linear-gradient(90deg,var(--rose),var(--brand-blue),var(--rose));
  background-size:200% 100%;animation:shimmer 3s linear infinite;
}
@keyframes shimmer{0%{background-position:0% 0}100%{background-position:200% 0}}
.ball{font-size:2.4rem;display:inline-block;margin-bottom:1rem;animation:bounce 1.8s ease-in-out infinite}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}
h1{font-family:'Bebas Neue',sans-serif;font-size:clamp(1.7rem,5vw,2.2rem);color:var(--ink);margin-bottom:.7rem}
p{font-size:.9rem;line-height:1.65;color:rgba(22,35,63,.62);max-width:400px;margin:0 auto 1.8rem}
.actions{display:flex;gap:.8rem;flex-wrap:wrap;justify-content:center}
.btn-p{display:inline-flex;align-items:center;gap:.5rem;background:var(--rose);color:#fff;padding:.8rem 1.7rem;border-radius:var(--radius);font-size:.78rem;font-weight:600;letter-spacing:.05em;text-transform:uppercase;text-decoration:none;transition:all var(--t)}
.btn-p:hover{transform:translateY(-3px);box-shadow:0 16px 40px rgba(234,59,121,.35)}
.btn-o{display:inline-flex;align-items:center;gap:.5rem;border:1px solid var(--border-navy);color:var(--ink);padding:.8rem 1.7rem;border-radius:var(--radius);font-size:.78rem;font-weight:600;letter-spacing:.05em;text-transform:uppercase;text-decoration:none;transition:all var(--t)}
.btn-o:hover{border-color:var(--rose);color:var(--rose)}
.foot-note{margin-top:1.8rem;font-size:.72rem;color:rgba(255,252,237,.5)}
.foot-note em{color:var(--rose);font-style:normal}
</style>
</head>
<body>
<div class="wrap">
  <img class="logo" src="https://raw.githubusercontent.com/albanbontemps33-cell/hbcbazadais/main/hand.png" alt="Logo HBC Bazadais">
  <div class="big404">4<em>0</em>4</div>
  <div class="card">
    <div class="ball">🤾</div>
    <h1>Hors du terrain !</h1>
    <p>La page que tu cherches a été mise hors-jeu, ou l'adresse est incorrecte. Retourne au centre du jeu pour continuer ta visite.</p>
    <div class="actions">
      <a class="btn-p" href="/hbcbazadais/#home">Retour à l'accueil</a>
      <a class="btn-o" href="/hbcbazadais/#contact">Nous contacter</a>
    </div>
  </div>
  <p class="foot-note">HBC <em>Bazadais</em> — 33430 Bazas, Gironde</p>
</div>
</body>
</html>
